name: Test badge

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes a dynamic shields.io endpoint badge (test count) to an orphan
# `badges` branch. The README points at the raw JSON on that branch, so the
# "tests" badge stays in sync with the real suite size without manual edits.
permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm wxt prepare
      - run: pnpm exec vitest run --reporter=json --outputFile=test-results.json

      - name: Build badge JSON
        run: node scripts/badge-test-count.mjs test-results.json test-count.json

      - name: Publish to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --quiet .
          git add test-count.json
          git commit -m "chore: update test-count badge"
          git push origin badges --force
