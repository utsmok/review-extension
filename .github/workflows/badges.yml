name: Badges

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes dynamic shields.io endpoint badges (test count + version) to an orphan
# `badges` branch. The README points at the raw JSON on that branch, so the badges
# stay in sync without depending on the GitHub-API token pool (which rate-limits
# shields.io's github/v/* badges).
permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm wxt prepare
      - run: pnpm exec vitest run --reporter=json --outputFile=test-results.json

      - name: Build badge JSON
        run: |
          node scripts/badge-test-count.mjs test-results.json test-count.json
          node scripts/badge-version.mjs version.json

      - name: Publish to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --quiet .
          git add test-count.json version.json
          git commit -m "chore: update badge endpoints"
          git push origin badges --force
