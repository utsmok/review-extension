<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRUST Report Preview</title>
  <style>
    /* Dev chrome — not part of the report output */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f2f5; color: #1a1a2e; }
    #controls {
      position: sticky; top: 0; z-index: 100;
      background: #1a1a2e; color: #e0e0e0;
      padding: 12px 20px;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #controls select, #controls button {
      background: #2d2d44; color: #e0e0e0; border: 1px solid #444;
      padding: 4px 10px; border-radius: 4px; font-size: 13px; cursor: pointer;
    }
    #controls select:hover, #controls button:hover { background: #3d3d54; }
    #controls button.active { background: #6d28d9; border-color: #7c3aed; }
    #controls .sep { width: 1px; height: 24px; background: #444; }
    #viewport {
      margin: 20px auto;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.12);
      border-radius: 4px;
      overflow: hidden;
    }
    #viewport iframe { border: none; display: block; width: 100%; height: 100%; }
    #viewport-info { font-size: 11px; color: #888; padding: 4px 12px; background: #fafafa; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="controls">
    <label>Variant
      <select id="variant">
        <option value="full">Full Report</option>
        <option value="nutrition">Nutrition Label</option>
        <option value="card">Business Card Label</option>
      </select>
    </label>
    <div class="sep"></div>
    <label>Data
      <select id="data-state">
        <option value="complete">Complete (all pass, high scores)</option>
        <option value="partial">Partial (few questions answered)</option>
        <option value="failed-qg">Failed Quality Gates</option>
        <option value="no-eval">No Evaluations</option>
        <option value="finalized-fail">Finalized as Fail</option>
        <option value="finalized-conditional">Finalized as Conditional</option>
      </select>
    </label>
    <div class="sep"></div>
    <label>Viewport
      <select id="viewport-size">
        <option value="1200">Desktop (1200px)</option>
        <option value="768">Tablet (768px)</option>
        <option value="480">Mobile (480px)</option>
        <option value="360">Small mobile (360px)</option>
        <option value="0">Full width</option>
      </select>
    </label>
    <div class="sep"></div>
    <button type="button" id="btn-print" title="Print preview">Print</button>
  </div>
  <div id="viewport-info"></div>
  <div id="viewport"></div>

  <script type="module" src="./preview.ts"></script>
</body>
</html>
